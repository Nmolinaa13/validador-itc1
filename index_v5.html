<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Validador ITC + BDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --purple:#534AB7; --purple-l:#EEEDFE; --purple-m:#AFA9EC;
    --teal:#1D9E75; --teal-l:#E1F5EE;
    --amber:#EF9F27; --amber-l:#FAEEDA;
    --red:#E24B4A; --red-l:#FCEBEB;
    --g50:#F7F6F3; --g100:#EDECE8; --g200:#D3D1C7; --g400:#888780; --g700:#444441; --g900:#1C1C1A;
    --bg:#F4F3EF; --card:#FFFFFF; --border:rgba(0,0,0,0.08); --border-s:rgba(0,0,0,0.14);
    --font:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--g900);min-height:100vh;}

  .topbar{background:var(--g900);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .topbar-title{font-size:14px;font-weight:500;letter-spacing:.02em;}
  .score-pill{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:4px 14px;color:#fff;transition:all .3s;}
  .score-pill.good{background:rgba(29,158,117,.25);border-color:rgba(29,158,117,.5);color:#5DCAA5;}
  .score-pill.warn{background:rgba(239,159,39,.25);border-color:rgba(239,159,39,.5);color:var(--amber);}
  .score-pill.danger{background:rgba(226,75,74,.25);border-color:rgba(226,75,74,.5);color:#F09995;}

  .progress-section{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;}
  .step-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;}
  .step-tab{flex:1;min-width:72px;padding:8px 4px;border-radius:8px;text-align:center;font-size:11px;font-weight:500;color:var(--g400);border:1px solid transparent;transition:all .25s;}
  .step-tab .tab-num{display:block;font-family:var(--mono);font-size:16px;font-weight:400;color:var(--g200);margin-bottom:2px;transition:all .25s;}
  .step-tab.done{color:var(--teal);} .step-tab.done .tab-num{color:var(--teal);}
  .step-tab.active{background:var(--purple-l);border-color:rgba(83,74,183,.2);color:var(--purple);}
  .step-tab.active .tab-num{color:var(--purple);}
  .prog-wrap{height:3px;background:var(--g100);border-radius:99px;margin-top:12px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--teal));transition:width .5s ease;}

  .main{max-width:680px;margin:0 auto;padding:28px 20px 80px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;}
  .card-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--purple-l);color:var(--purple);margin-bottom:8px;}
  .card-title{font-size:17px;font-weight:600;color:var(--g900);}
  .card-sub{font-size:13px;color:var(--g400);margin-top:3px;line-height:1.5;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g400);margin-bottom:6px;}
  .field label .tip{font-weight:400;text-transform:none;letter-spacing:0;color:var(--g200);}
  .field input,.field textarea{width:100%;font-family:var(--font);font-size:14px;line-height:1.5;padding:10px 14px;border:1px solid var(--border-s);border-radius:10px;background:var(--g50);color:var(--g900);resize:vertical;transition:border-color .2s,box-shadow .2s;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(83,74,183,.1);background:#fff;}
  .field input.err,.field textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(226,75,74,.08);}
  .cong{margin-top:6px;padding:8px 12px;background:var(--amber-l);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;font-size:12px;color:#633806;}

  .rating-group{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .rating-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .rating-label{font-size:13px;font-weight:600;color:var(--g900);margin-bottom:3px;}
  .rating-q{font-size:12px;color:var(--g400);margin-bottom:10px;line-height:1.5;}
  .stars{display:flex;gap:5px;margin-bottom:8px;}
  .star{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-s);background:var(--g50);font-family:var(--mono);font-size:13px;font-weight:500;color:var(--g400);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;}
  .star:hover{background:var(--purple-l);border-color:var(--purple-m);color:var(--purple);}
  .star.on{background:var(--purple);border-color:var(--purple);color:#fff;}
  .just-input{width:100%;font-family:var(--font);font-size:12px;padding:7px 11px;border:1px solid var(--border-s);border-radius:8px;background:var(--g50);color:var(--g900);resize:none;}
  .just-input:focus{outline:none;border-color:var(--purple);background:#fff;}

  .semaphore{display:flex;gap:8px;margin:16px 0;}
  .sem{flex:1;padding:10px 8px;border-radius:10px;border:1px solid;text-align:center;font-size:11px;font-weight:600;opacity:.35;transition:opacity .3s;}
  .sem.on{opacity:1;}
  .sem-r{background:var(--red-l);border-color:rgba(226,75,74,.3);color:#791F1F;}
  .sem-y{background:var(--amber-l);border-color:rgba(239,159,39,.3);color:#633806;}
  .sem-g{background:var(--teal-l);border-color:rgba(29,158,117,.3);color:#085041;}
  .sem-score{font-size:22px;font-weight:300;font-family:var(--mono);display:block;margin-bottom:2px;}

  .ai-bubble{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:13px;line-height:1.75;border:1px solid;}
  .ai-loading{background:var(--purple-l);border-color:rgba(83,74,183,.2);color:#3C3489;}
  .ai-info{background:var(--purple-l);border-color:rgba(83,74,183,.2);color:#26215C;}
  .ai-warn{background:var(--amber-l);border-color:rgba(239,159,39,.3);color:#412402;}
  .ai-success{background:var(--teal-l);border-color:rgba(29,158,117,.3);color:#04342C;}
  .ai-danger{background:var(--red-l);border-color:rgba(226,75,74,.2);color:#501313;}
  .ai-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;opacity:.7;}
  .ai-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .blocker{margin-top:10px;padding:8px 12px;border-radius:8px;border:1px solid;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;}
  .blocker-warn{background:var(--amber-l);border-color:var(--amber);color:#633806;}
  .blocker-ok{background:var(--teal-l);border-color:var(--teal);color:#085041;}

  .trophy-block{text-align:center;padding:24px 0 8px;}
  .trophy-em{font-size:56px;display:block;margin-bottom:10px;}
  .trophy-title{font-size:20px;font-weight:600;}
  .trophy-score{font-family:var(--mono);font-size:42px;font-weight:300;color:var(--g900);margin:8px 0 2px;}
  .trophy-sub{font-size:13px;color:var(--g400);}

  .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;}
  .btn{font-family:var(--font);font-size:14px;font-weight:500;padding:10px 22px;border-radius:10px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;border:1px solid;}
  .btn-ghost{background:transparent;border-color:var(--border-s);color:var(--g700);}
  .btn-ghost:hover{background:var(--g50);}
  .btn-primary{background:var(--purple);border-color:var(--purple);color:#fff;}
  .btn-primary:hover{background:#3C3489;}
  .btn-teal{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn-teal:hover{background:#0F6E56;}
  .btn-download{background:var(--g900);border-color:var(--g900);color:#fff;}
  .btn-download:hover{background:var(--g700);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .divider{height:1px;background:var(--border);margin:16px 0;}

  @media(max-width:480px){.main{padding:16px 12px 80px;}.card{padding:16px;}.topbar{padding:12px 16px;}}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Validador · ITC + BDM</span>
  <div class="score-pill" id="score-pill">0 / 20 pts</div>
</div>

<div class="progress-section">
  <div class="step-tabs" id="step-tabs"></div>
  <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="main" id="main-content"></div>

<script>
const STEPS=[
  {id:'intro',label:'Proyecto',icon:'01'},
  {id:'diagnostico',label:'Diagnóstico',icon:'02'},
  {id:'propuesta',label:'Propuesta',icon:'03'},
  {id:'matriz',label:'Matriz',icon:'04'},
  {id:'riesgos',label:'Riesgos',icon:'05'},
  {id:'cierre',label:'Resultado',icon:'06'},
];

const state={
  step:0,
  data:{},
  ratings:{causalidad:0,plausibilidad:0,seguridad:0,sostenibilidad:0},
  just:{causalidad:'',plausibilidad:'',seguridad:'',sostenibilidad:''},
  aiFeedback:{diag:'',prop:'',mat:'',final:''},
  canAdvance:true,
};

function totalScore(){return Object.values(state.ratings).reduce((a,b)=>a+b,0);}

function updateScorePill(){
  const s=totalScore();
  const p=document.getElementById('score-pill');
  p.textContent=s+' / 20 pts';
  p.className='score-pill'+(s>=16?' good':s>=11?' warn':s>0?' danger':'');
}

function buildTabs(){
  document.getElementById('step-tabs').innerHTML=STEPS.map((s,i)=>{
    let cls='step-tab';
    if(i<state.step)cls+=' done';
    else if(i===state.step)cls+=' active';
    return `<div class="${cls}"><span class="tab-num">${i<state.step?'✓':s.icon}</span>${s.label}</div>`;
  }).join('');
  document.getElementById('prog-fill').style.width=Math.round((state.step/(STEPS.length-1))*100)+'%';
}

function fv(id){return(state.data[id]||'').trim();}

function field(id,label,tip,placeholder,rows){
  const val=state.data[id]||'';
  if(rows)return`<div class="field"><label>${label} <span class="tip">${tip||''}</span></label><textarea id="f_${id}" rows="${rows}" placeholder="${placeholder}" oninput="state.data['${id}']=this.value;clearErr('${id}')">${val}</textarea></div>`;
  return`<div class="field"><label>${label} <span class="tip">${tip||''}</span></label><input type="text" id="f_${id}" value="${val.replace(/"/g,'&quot;')}" placeholder="${placeholder}" oninput="state.data['${id}']=this.value;clearErr('${id}')"/></div>`;
}

function clearErr(id){const el=document.getElementById('f_'+id);if(el)el.classList.remove('err');}
function markErr(id){const el=document.getElementById('f_'+id);if(el){el.classList.add('err');el.focus();}}
function showCong(id,msg){
  const el=document.getElementById('f_'+id);if(!el)return;
  let a=el.parentNode.querySelector('.cong');
  if(!a){a=document.createElement('div');a.className='cong';el.after(a);}
  a.textContent='⚠ '+msg;
}
function clearCong(id){const el=document.getElementById('f_'+id);if(!el)return;const a=el.parentNode.querySelector('.cong');if(a)a.remove();}

function validate(){
  if(state.step===0){
    const n=fv('nombre_proyecto'),o=fv('outcome');
    if(!n){markErr('nombre_proyecto');return false;}
    if(!o){markErr('outcome');return false;}
    if(n.toLowerCase()===o.toLowerCase()){showCong('outcome','El nombre y el outcome no pueden ser idénticos.');return false;}
    clearCong('outcome');
  }
  if(state.step===1){
    for(const f of['driver1','driver2','driver3','compromiso_oculto','gran_suposicion']){if(!fv(f)){markErr(f);return false;}}
    const ow=fv('outcome').toLowerCase().split(' ')[0];
    const co=fv('compromiso_oculto').toLowerCase();
    if(ow.length>4&&co.startsWith(ow)){showCong('compromiso_oculto','El compromiso oculto parece repetir el outcome. Debe ser el competidor interno.');return false;}
    clearCong('compromiso_oculto');
  }
  if(state.step===2){
    if(!fv('accion_desbloqueo')){markErr('accion_desbloqueo');return false;}
    if(!fv('logica_causal')){markErr('logica_causal');return false;}
  }
  if(state.step===3){
    for(const c of['causalidad','plausibilidad','seguridad','sostenibilidad']){
      if(!state.ratings[c]){showBubble('mat-fb','Califica todos los criterios antes de continuar.','ai-warn');return false;}
    }
  }
  if(state.step===4){if(!fv('supuesto_clave')){markErr('supuesto_clave');return false;}}
  return true;
}

function showBubble(id,msg,cls){
  const el=document.getElementById(id);
  if(el)el.innerHTML=`<div class="ai-bubble ${cls}"><div class="ai-label"><div class="ai-dot"></div>Asistente IA</div>${msg}</div>`;
}

async function callAI(prompt,containerId,thenFn){
  const el=document.getElementById(containerId);
  if(!el)return thenFn&&thenFn(true);
  el.innerHTML=`<div class="ai-bubble ai-loading"><div class="ai-label"><div class="ai-dot"></div>Analizando tu propuesta…</div></div>`;
  state.canAdvance=false;
  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompt}]})
    });
    const d=await r.json();
    if(d.error){
      el.innerHTML=`<div class="ai-bubble ai-warn"><div class="ai-label"><div class="ai-dot"></div>Asistente IA</div>Error: ${d.error}. Puedes continuar de todas formas.</div>`;
      state.canAdvance=true;
      return thenFn&&thenFn(true);
    }
    const text=d.content?.map(b=>b.text||'').join('')||'Sin respuesta.';
    const hasBlock=text.toLowerCase().includes('incongruencia')||text.toLowerCase().includes('no toca')||text.toLowerCase().includes('revisar antes');
    const cls=hasBlock?'ai-warn':'ai-info';
    const stored=containerId==='diag-fb'?'diag':containerId==='prop-fb'?'prop':containerId==='mat-fb'?'mat':'final';
    state.aiFeedback[stored]=text;
    el.innerHTML=`<div class="ai-bubble ${cls}"><div class="ai-label"><div class="ai-dot" style="animation:none;opacity:1"></div>Asistente IA</div>${text.replace(/\n\n/g,'</p><p style="margin-top:8px">').replace(/\n/g,'<br>')}</div>`;
    if(hasBlock){
      el.innerHTML+=`<div class="blocker blocker-warn">⚠ La IA detectó una incongruencia. Revisa tu propuesta antes de continuar.</div>`;
      state.canAdvance=false;
      const btnNext=document.createElement('button');
      btnNext.className='btn btn-ghost';btnNext.style.marginTop='10px';btnNext.style.fontSize='12px';
      btnNext.textContent='Entendido, continuar de todas formas →';
      btnNext.onclick=()=>{state.canAdvance=true;el.querySelector('.blocker').remove();btnNext.remove();thenFn&&thenFn(false);};
      el.appendChild(btnNext);
    } else {
      state.canAdvance=true;
      thenFn&&thenFn(false);
    }
  }catch(e){
    el.innerHTML=`<div class="ai-bubble ai-warn">No se pudo conectar con la IA. Puedes continuar de todas formas.</div>`;
    state.canAdvance=true;
    thenFn&&thenFn(true);
  }
}

function buildPrompt(step){
  const d=state.data,r=state.ratings;
  const base=`Proyecto: ${d.nombre_proyecto}\nOutcome buscado: ${d.outcome}`;

  const marcoBDM=`MARCO TEÓRICO QUE DEBES USAR — El Behavioural Drivers Model (BDM) de UNICEF organiza los factores que impulsan o bloquean un comportamiento en tres categorías:

1. PSICOLOGÍA (factores individuales internos): incluye sesgos cognitivos (atajos mentales que distorsionan la información), interés (atención, factibilidad percibida, ganancias/pérdidas, riesgos, esfuerzo, apelación emocional), actitud (valores, creencias, experiencias pasadas, emociones, aspiraciones), autoeficacia (confianza, agencia, habilidades, autonomía de decisión, bienestar emocional), racionalidad limitada (hábitos, sesgo del presente, procrastinación, factores hassle) e intención (disposición real a cambiar).

2. SOCIOLOGÍA (factores relacionales y colectivos): incluye influencia social (normas descriptivas — lo que otros hacen —, normas inyectivas — lo que otros esperan que hagas —, presión social, redes de referencia, identidad social, influencia de quienes detentan poder), dinámica comunitaria (autoeficacia colectiva, cohesión social, liderazgo, sentido de pertenencia, equidad de participación) y meta-normas (ideologías de género, dinámicas de poder, proceso de socialización, normas morales, patrones de toma de decisiones familiares).

3. ENTORNO (factores estructurales y contextuales): incluye entorno de comunicación (medios, redes sociales, figuras públicas, palabra a palabra), alternativas emergentes (desviantes positivos, movimientos sociales, innovaciones), entidades gobernantes (políticas, instituciones religiosas, sistema educativo) y barreras estructurales (acceso a servicios, infraestructura, condiciones de vida, confianza en proveedores).

MARCO ITC — El Immunity to Change (ITC) de Kegan y Lahey añade la dimensión interna: las personas tienen compromisos visibles (lo que dicen querer cambiar) pero también compromisos ocultos (lo que inconscientemente protegen para mantener su identidad, estatus o pertenencia al grupo) sostenidos por una Gran Suposición sobre qué catástrofe ocurriría si cambiaran. El cambio real requiere diseñar experimentos seguros que cuestionen esa Gran Suposición sin amenazar la identidad ni el tejido social.

TIPOS DE INTERVENCIÓN según el BDM (úsalos para orientar tus recomendaciones):
- Para drivers PSICOLÓGICOS: habilidades para la vida y empoderamiento, apoyo psicosocial, fortalecimiento de capacidades, diseño centrado en el ser humano, enfoque de probabilidad de elaboración
- Para drivers SOCIOLÓGICOS: promoción de normas positivas, enfoque de desviantes positivos, alianzas de sociedad civil, deliberaciones de valores, entrenamiento de observadores, involucramiento de guardianes/gatekeepers, difusión organizada
- Para drivers de ENTORNO: campañas multimedia, comunicación digital, diálogos cara a cara, abogacía y política pública, movilización social, fortalecimiento de sistemas, enfoque basado en comunidad (CBOs, FBOs)
- Para META-NORMAS: programación transformadora de género, programas de desarrollo de la primera infancia, reducción del estigma y la discriminación, programación de cohesión social`;

  if(step===1)return`${marcoBDM}\n\nEres un acompañante experto en cambio social comunitario. Tu rol es AMPLIAR el pensamiento del equipo, no solo validar. Trabaja con lo que ellos escribieron.\n\nANÁLISIS REQUERIDO (responde en español, tono cálido y directo, sin jerga corporativa):\n\n1. Evalúa brevemente (2-3 oraciones) cada driver usando el BDM: ¿El driver psicológico apunta a una dimensión real de la psicología individual (autoeficacia, actitud, sesgo cognitivo, racionalidad limitada)? ¿El driver sociológico identifica un mecanismo social concreto (norma descriptiva, norma inyectiva, dinámica comunitaria, meta-norma)? ¿El driver ambiental nombra una barrera estructural o de entorno real (barrera estructural, entorno de comunicación, entidad gobernante)?\n\n2. Evalúa el ITC: ¿Los compromisos ocultos identificados compiten genuinamente con el outcome, o son una reformulación del mismo? ¿La Gran Suposición está enraizada en la identidad, el estatus o la pertenencia comunitaria, o es demasiado genérica? Si hay problemas de coherencia, menciona "incongruencia" explícitamente.\n\n3. Genera 2-3 preguntas que amplíen lo que el equipo ya escribió — enfocadas en dimensiones del BDM que podrían haber quedado sin explorar, o en cómo profundizar los compromisos ocultos o la Gran Suposición. Las preguntas deben abrir posibilidades, no cerrarlas.\n\n${base}\nDriver 1 (Psicológico): ${d.driver1}\nDriver 2 (Sociológico): ${d.driver2}\nDriver 3 (Ambiental): ${d.driver3}\nCompromisos ocultos: ${d.compromiso_oculto}\nGran Suposición: ${d.gran_suposicion}`;

  if(step===2)return`${marcoBDM}\n\nEres un acompañante experto en cambio social comunitario. Tu rol es AMPLIAR el pensamiento del equipo a partir de su propuesta, no solo validarla.\n\nANÁLISIS REQUERIDO (responde en español, tono cálido y directo):\n\n1. Evalúa (2-3 oraciones) si la estrategia de intervención usa los tipos de intervención adecuados según el BDM para cada driver identificado. ¿La capa psicológica fortalece autoeficacia, actitud o reduce sesgos? ¿La capa sociológica trabaja normas, influencia social o dinámica comunitaria? ¿La capa ambiental reduce barreras estructurales o actúa sobre el entorno de comunicación?\n\n2. Evalúa el ITC: ¿La estrategia crea un "experimento seguro" que permita a los miembros de la comunidad cuestionar su Gran Suposición sin amenazar su identidad o tejido social? ¿La lógica causal conecta explícitamente la acción con el debilitamiento de los compromisos ocultos? Si la propuesta no toca la inmunidad interna, menciona "no toca" o "incongruencia" y recomienda "revisar antes de continuar".\n\n3. Genera 2 preguntas que amplíen la estrategia — por ejemplo, sobre qué tipo de intervención del BDM podría fortalecer la capa más débil, o cómo diseñar el experimento seguro para empezar a desafiar la Gran Suposición de forma gradual.\n\n${base}\nDrivers BDM:\n- Driver 1 (Psicológico): ${d.driver1}\n- Driver 2 (Sociológico): ${d.driver2}\n- Driver 3 (Ambiental): ${d.driver3}\nCompromisos ocultos: ${d.compromiso_oculto}\nGran Suposición: ${d.gran_suposicion}\nEstrategia de intervención: ${d.accion_desbloqueo}\nLógica causal: ${d.logica_causal}`;

  if(step===3){
    const score=totalScore();
    const preguntasGuia=score<=10?`\n\nPuntaje bajo (${score}/20). Después de tu análisis incluye 3 preguntas guía numeradas basadas en los criterios más débiles. Usa el BDM para orientar cada pregunta: señala qué dimensión del modelo (psicológica, sociológica o ambiental) o qué elemento del ITC (compromiso oculto, Gran Suposición, experimento seguro) necesita ser revisado.`:score<=15?`\n\nPuntaje medio (${score}/20). Incluye 2 preguntas guía numeradas al final que ayuden al equipo a fortalecer los criterios más frágiles, conectando con las dimensiones del BDM o el ITC que correspondan.`:'';
    return`${marcoBDM}\n\nEres un acompañante experto en cambio social. El equipo calificó su propuesta:\n- Causalidad: ${r.causalidad}/5 — "${state.just.causalidad}"\n- Plausibilidad: ${r.plausibilidad}/5 — "${state.just.plausibilidad}"\n- Seguridad psicológica y aceptabilidad: ${r.seguridad}/5 — "${state.just.seguridad}"\n- Sostenibilidad: ${r.sostenibilidad}/5 — "${state.just.sostenibilidad}"\nTotal: ${score}/20\n\nEstrategia: "${d.accion_desbloqueo}"\n\nANÁLISIS REQUERIDO (2-3 oraciones, tono cálido, en español):\n\nEvalúa si las calificaciones son coherentes con la estrategia usando el BDM como referencia:\n- Causalidad: ¿La estrategia realmente ataca las dimensiones de los 3 drivers identificados (psicológico, sociológico, ambiental) Y debilita los compromisos ocultos señalados en el diagnóstico ITC?\n- Plausibilidad: ¿Los tipos de intervención propuestos (según el BDM) son implementables con los recursos y tiempos disponibles en el contexto comunitario?\n- Seguridad psicológica: ¿La estrategia permite que los miembros de la comunidad desafíen su Gran Suposición de forma gradual, sin exponer su identidad o su lugar en el grupo? ¿Podría haber rechazo por parte de quienes detentan poder (gatekeepers)?\n- Sostenibilidad: ¿La estrategia trabaja sobre normas sociales o estructuras (meta-normas, dinámica comunitaria, entidades gobernantes) que permitan que el cambio se mantenga una vez que la organización reconozca sus propias limitaciones?\n\nLuego genera 1-2 preguntas que amplíen el análisis del equipo.${preguntasGuia}`;
  }

  if(step===5){
    const score=totalScore();
    const preguntasFinales=score<=10?`\n\nPuntaje final bajo (${score}/20). Incluye 4 preguntas guía numeradas usando el BDM e ITC como referencia: 1) sobre la profundidad del driver psicológico y su relación con la autoeficacia o los sesgos cognitivos, 2) sobre si los compromisos ocultos compiten genuinamente con el outcome, 3) sobre qué tipo de intervención del BDM podría atacar mejor el driver más crítico, 4) sobre qué supuestos del entorno (barreras estructurales, entidades gobernantes, entorno de comunicación) podrían comprometer la estrategia.`:score<=15?`\n\nPuntaje medio (${score}/20). Incluye 2-3 preguntas guía numeradas señalando los ajustes más urgentes, conectando con las dimensiones del BDM o el ITC que correspondan.`:'';
    return`${marcoBDM}\n\nEres un acompañante experto en cambio social comunitario con dominio del BDM de UNICEF y del ITC de Kegan. Analiza esta ficha completa en 5-6 oraciones en español:\n\n¿Los 3 drivers identificados cubren adecuadamente las tres categorías del BDM (psicología, sociología, entorno)? ¿Los compromisos ocultos y la Gran Suposición tienen coherencia con esos drivers? ¿La estrategia de intervención usa los tipos de acción apropiados del BDM para cada driver, y al mismo tiempo crea condiciones para desafiar la Gran Suposición de forma segura? ¿La lógica causal conecta explícitamente los cambios esperados en los drivers con el debilitamiento de la inmunidad al cambio? Señala las fortalezas y los 2 puntos más críticos a resolver antes de ejecutar.\n\n${base}\nDrivers BDM:\n- Psicológico: ${d.driver1}\n- Sociológico: ${d.driver2}\n- Ambiental: ${d.driver3}\nCompromisos ocultos: ${d.compromiso_oculto}\nGran Suposición: ${d.gran_suposicion}\nEstrategia de intervención: ${d.accion_desbloqueo}\nLógica causal: ${d.logica_causal}\nSupuestos de la intervención: ${d.supuesto_clave}\nRiesgo de efecto rebote: ${d.riesgo_rebote||'No especificado'}\nPuntajes — Causalidad: ${r.causalidad}/5, Plausibilidad: ${r.plausibilidad}/5, Seguridad: ${r.seguridad}/5, Sostenibilidad: ${r.sostenibilidad}/5. Total: ${score}/20${preguntasFinales}`;
  }
  return'';
}

function setRating(criterion,val){
  state.ratings[criterion]=val;
  document.querySelectorAll(`#stars_${criterion} .star`).forEach((s,i)=>s.classList.toggle('on',i<val));
  updateScorePill();updateSemaphore();
}

function updateSemaphore(){
  const s=totalScore();
  ['r','y','g'].forEach(x=>{const el=document.getElementById('sem-'+x);if(el)el.classList.remove('on');});
  const el=document.getElementById(s>=16?'sem-g':s>=11?'sem-y':s>=1?'sem-r':null);
  if(el)el.classList.add('on');
  const sc=document.getElementById('mat-score');if(sc)sc.textContent=s;
}

function downloadReport(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const d=state.data,r=state.ratings;
  const score=totalScore();
  const semLabel=score>=16?'Ruta Integral (16-20)':score>=11?'Ruta viable, frágil (11-15)':'Ruta superficial (6-10)';
  const lineH=7;let y=20;
  const addLine=(text,size,bold,color)=>{
    doc.setFontSize(size||11);doc.setFont('helvetica',bold?'bold':'normal');
    if(color)doc.setTextColor(...color);else doc.setTextColor(28,28,26);
    const lines=doc.splitTextToSize(text,170);
    lines.forEach(l=>{if(y>270){doc.addPage();y=20;}doc.text(l,20,y);y+=lineH;});
  };
  const addSection=(title)=>{y+=3;addLine(title,13,true,[83,74,183]);y+=1;doc.setDrawColor(83,74,183);doc.setLineWidth(0.3);doc.line(20,y,190,y);y+=5;};
  const addField=(label,value)=>{addLine(label+':',10,true);addLine(value||'—',10,false,[60,60,58]);y+=2;};

  doc.setFillColor(28,28,26);doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont('helvetica','bold');
  doc.text('Ficha de Validación — ITC + BDM',20,18);
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(180,180,170);
  doc.text('Generado el '+new Date().toLocaleDateString('es-CO'),20,25);
  y=45;

  const scoreColor=score>=16?[29,158,117]:score>=11?[239,159,39]:[226,75,74];
  doc.setFillColor(...scoreColor);doc.setTextColor(255,255,255);
  doc.roundedRect(20,y,170,20,3,3,'F');
  doc.setFontSize(13);doc.setFont('helvetica','bold');
  doc.text(`${semLabel} — ${score}/20 puntos`,105,y+13,{align:'center'});
  y+=30;

  addSection('1. Identidad del proyecto');
  addField('Nombre del proyecto',d.nombre_proyecto);
  addField('Outcome',d.outcome);

  addSection('2. Diagnóstico BDM + ITC');
  addField('Driver 1 (BDM)',d.driver1);
  addField('Driver 2 (BDM)',d.driver2);
  addField('Driver 3 (BDM)',d.driver3);
  addField('Compromiso oculto (ITC)',d.compromiso_oculto);
  addField('Gran Suposición',d.gran_suposicion);
  if(state.aiFeedback.diag){addLine('Análisis IA — Diagnóstico:',10,true);addLine(state.aiFeedback.diag,10,false,[60,60,58]);y+=2;}

  addSection('3. Propuesta de intervención');
  addField('Estrategia de intervención',d.accion_desbloqueo);
  addField('Lógica causal',d.logica_causal);
  if(state.aiFeedback.prop){addLine('Análisis IA — Propuesta de intervención:',10,true);addLine(state.aiFeedback.prop,10,false,[60,60,58]);y+=2;}

  addSection('4. Matriz de validación');
  const criteria=[['Causalidad','causalidad'],['Plausibilidad','plausibilidad'],['Seguridad psicológica y aceptabilidad','seguridad'],['Sostenibilidad','sostenibilidad']];
  criteria.forEach(([label,key])=>{
    addLine(`${label}: ${r[key]}/5`,10,true);
    if(state.just[key])addLine('Justificación: '+state.just[key],10,false,[60,60,58]);
    y+=1;
  });
  if(state.aiFeedback.mat){addLine('Análisis IA — Matriz:',10,true);addLine(state.aiFeedback.mat,10,false,[60,60,58]);y+=2;}

  addSection('5. Supuestos y riesgos de la intervención');
  addField('Supuestos de la intervención',d.supuesto_clave);
  addField('Riesgo de efecto rebote',d.riesgo_rebote||'No especificado');

  if(state.aiFeedback.final){
    addSection('6. Análisis final IA');
    addLine(state.aiFeedback.final,10,false,[60,60,58]);
  }

  const nombre=(d.nombre_proyecto||'reporte').replace(/\s+/g,'-').toLowerCase();
  doc.save(`validacion-itc-${nombre}.pdf`);
}

function goToStep(n){state.step=n;renderStep();window.scrollTo({top:0,behavior:'smooth'});}
function goBack(){if(state.step>0)goToStep(state.step-1);}

function goNext(){
  if(!validate())return;
  const cur=state.step;
  if(cur===1){callAI(buildPrompt(1),'diag-fb',ok=>goToStep(2));}
  else if(cur===2){callAI(buildPrompt(2),'prop-fb',ok=>{if(ok||state.canAdvance)goToStep(3);});}
  else if(cur===3){callAI(buildPrompt(3),'mat-fb',ok=>goToStep(4));}
  else{goToStep(cur+1);}
}

function renderStep(){
  const c=document.getElementById('main-content');
  const s=STEPS[state.step];

  if(s.id==='intro'){
    c.innerHTML=`<div class="card">
      <div style="margin-bottom:20px"><span class="card-tag">Paso 1 · Proyecto</span>
      <div class="card-title">Identidad de la propuesta</div>
      <div class="card-sub">Define el punto de partida antes de hacer el diagnóstico</div></div>
      ${field('nombre_proyecto','Nombre del proyecto','','Ej: Jóvenes comunicadores del territorio')}
      ${field('outcome','Outcome','— el cambio observable que buscas','Ej: Los líderes comunitarios delegan activamente la comunicación digital a los jóvenes',3)}
    </div>
    <div class="btn-row"><button class="btn btn-primary" onclick="goNext()">Continuar →</button></div>`;
  }

  if(s.id==='diagnostico'){
    c.innerHTML=`<div class="card">
      <div style="margin-bottom:20px"><span class="card-tag">Paso 2 · Diagnóstico</span>
      <div class="card-title">Rayos X: BDM + Immunity to Change</div>
      <div class="card-sub">Identifica los 3 drivers que bloquean el cambio y la inmunidad interna que lo sostiene</div></div>

      <div style="font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g400);margin-bottom:12px;">Drivers BDM <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--g200)">— factores externos que dificultan el comportamiento deseado</span></div>

      <div style="background:var(--g50);border:1px solid var(--border-s);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-size:11px;font-weight:600;background:#EEEDFE;color:#534AB7;padding:2px 10px;border-radius:99px;">Psicológico</span>
          <span style="font-size:11px;color:var(--g400)">Driver 1</span>
        </div>
        ${field('driver1','Dimensión del BDM','','Ej: Autoeficacia — los jóvenes sienten que "no saben lo suficiente" para participar en espacios de decisión comunitaria')}
      </div>

      <div style="background:var(--g50);border:1px solid var(--border-s);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-size:11px;font-weight:600;background:#E1F5EE;color:#085041;padding:2px 10px;border-radius:99px;">Sociológico</span>
          <span style="font-size:11px;color:var(--g400)">Driver 2</span>
        </div>
        ${field('driver2','Dimensión del BDM','','Ej: Normas sociales — participar en espacios comunitarios es visto como algo de adultos o de "gente muy política", no de jóvenes')}
      </div>

      <div style="background:var(--g50);border:1px solid var(--border-s);border-radius:12px;padding:14px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span style="font-size:11px;font-weight:600;background:#FAEEDA;color:#633806;padding:2px 10px;border-radius:99px;">Ambiental</span>
          <span style="font-size:11px;color:var(--g400)">Driver 3</span>
        </div>
        ${field('driver3','Dimensión del BDM','','Ej: Entorno institucional — los espacios comunitarios no están diseñados para jóvenes: horarios rígidos, lenguaje técnico y dinámicas excluyentes')}
      </div>

      <div style="height:1px;background:var(--border);margin:20px 0;"></div>
      <div style="font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g400);margin-bottom:12px;">Immunity to Change (ITC) <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--g200)">— la resistencia interna que bloquea el cambio aunque la persona quiera cambiar</span></div>

      <div class="field"><label>Compromisos ocultos <span class="tip">— los competidores internos del cambio. Puedes listar uno o varios: ¿qué protegen inconscientemente los miembros de la comunidad?</span></label>
      <textarea id="f_compromiso_oculto" rows="4" placeholder='Ej: "Me comprometo a evitar situaciones donde pueda quedar en evidencia como alguien que no sabe o no pertenece."&#10;"Me comprometo a no contradecir a los líderes mayores para no ser excluido del grupo."' oninput="state.data['compromiso_oculto']=this.value;clearErr('compromiso_oculto')">${state.data.compromiso_oculto||''}</textarea></div>

      ${field('gran_suposicion','La Gran Suposición','— la creencia profunda que hace que los compromisos ocultos parezcan necesarios para sobrevivir o pertenecer','Ej: "Si participo y no entiendo o me equivoco, los demás confirmarán que no soy capaz o que no debería estar ahí"',3)}
      <div id="diag-fb"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">← Atrás</button>
      <button class="btn btn-primary" onclick="goNext()">Analizar con IA →</button>
    </div>`;
  }

  if(s.id==='propuesta'){
    c.innerHTML=`<div class="card">
      <div style="margin-bottom:20px"><span class="card-tag">Paso 3 · Propuesta</span>
      <div class="card-title">La propuesta de intervención</div>
      <div class="card-sub">Diseña la estrategia que ataca los drivers Y debilita la inmunidad interna</div></div>
      ${field('accion_desbloqueo','Estrategia de intervención','— ¿qué propones hacer para responder a cada driver Y crear condiciones para que los miembros de la comunidad cuestionen su Gran Suposición de forma segura?','Ej: Diseñar laboratorios seguros de participación (talleres de simulación de decisiones) + campaña "Los jóvenes sí deciden" (visibilización de pares) + rediseño de espacios comunitarios con horarios flexibles y lenguaje accesible. Cada capa responde a un driver: psicológico, sociológico y ambiental.',6)}
      ${field('logica_causal','Lógica causal','— Si [estrategia], entonces [cambios en la comunidad], porque [mecanismo que debilita los compromisos ocultos y la Gran Suposición]','Ej: Si implementamos laboratorios seguros, visibilizamos roles juveniles y adaptamos los espacios, entonces aumenta la autoeficacia, cambia la norma social sobre quién puede participar y se reducen las barreras estructurales — lo que debilita el miedo al juicio y a no pertenecer, y conduce a mayor participación juvenil real y sostenida.',4)}
      <div id="prop-fb"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">← Atrás</button>
      <button class="btn btn-primary" onclick="goNext()">Analizar con IA →</button>
    </div>`;
  }

  if(s.id==='matriz'){
    const crit=[
      {id:'causalidad',label:'Causalidad',q:'¿La propuesta de intervención ataca la raíz de los drivers y los compromisos ocultos identificados a través de los Rayos X?'},
      {id:'plausibilidad',label:'Plausibilidad',q:'¿Es realista en el tiempo? ¿Podré evaluarla? ¿Tenemos los recursos necesarios para ejecutarla?'},
      {id:'seguridad',label:'Seguridad psicológica y aceptabilidad',q:'¿Permite desafiar la Gran Suposición sin exponer a los miembros de la comunidad? ¿Podría haber rechazo?'},
      {id:'sostenibilidad',label:'Sostenibilidad',q:'¿El cambio se mantendrá sin nuestra presencia una vez que la organización reconozca sus limitaciones para el cambio?'},
    ];
    c.innerHTML=`<div class="card">
      <div style="margin-bottom:20px"><span class="card-tag">Paso 4 · Matriz</span>
      <div class="card-title">Validación de calidad</div>
      <div class="card-sub">Califica del 1 al 5 cada criterio y justifica</div></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:13px;color:var(--g400)">Puntaje total</span>
        <span style="font-family:var(--mono);font-size:32px;font-weight:300"><span id="mat-score">${totalScore()}</span><span style="font-size:16px;color:var(--g400)">/20</span></span>
      </div>
      <div class="semaphore">
        <div class="sem sem-r${totalScore()>=1&&totalScore()<=10?' on':''}" id="sem-r"><span class="sem-score">6–10</span>Superficial</div>
        <div class="sem sem-y${totalScore()>=11&&totalScore()<=15?' on':''}" id="sem-y"><span class="sem-score">11–15</span>Frágil</div>
        <div class="sem sem-g${totalScore()>=16?' on':''}" id="sem-g"><span class="sem-score">16–20</span>Integral</div>
      </div>
      <div class="divider"></div>
      ${crit.map(cr=>`<div class="rating-group">
        <div class="rating-label">${cr.label}</div>
        <div class="rating-q">${cr.q}</div>
        <div class="stars" id="stars_${cr.id}">${[1,2,3,4,5].map(v=>`<div class="star${state.ratings[cr.id]>=v?' on':''}" onclick="setRating('${cr.id}',${v})">${v}</div>`).join('')}</div>
        <textarea class="just-input" rows="1" placeholder="Justificación breve…" oninput="state.just['${cr.id}']=this.value">${state.just[cr.id]||''}</textarea>
      </div>`).join('')}
      <div id="mat-fb"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">← Atrás</button>
      <button class="btn btn-primary" onclick="goNext()">Analizar con IA →</button>
    </div>`;
  }

  if(s.id==='riesgos'){
    c.innerHTML=`<div class="card">
      <div style="margin-bottom:20px"><span class="card-tag">Paso 5 · Riesgos</span>
      <div class="card-title">Supuestos e riesgos de la intervención</div>
      <div class="card-sub">Identifica las condiciones que deben mantenerse y lo que podría salir mal</div></div>
      ${field('supuesto_clave','Supuestos de la intervención','— ¿qué condiciones previas deben mantenerse para que la estrategia funcione?','Ej: Que los miembros de la comunidad tienen un dispositivo con acceso a internet permanente para participar en los espacios virtuales de decisión',3)}
      ${field('riesgo_rebote','Riesgo de efecto rebote','— ¿podría la intervención reforzar la inmunidad al cambio o generar el efecto contrario?','Ej: Si los miembros de la comunidad sienten que la estrategia amenaza su rango de poder en la organización, la propuesta de intervención se verá comprometida',3)}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">← Atrás</button>
      <button class="btn btn-primary" onclick="goNext()">Ver resultado →</button>
    </div>`;
  }

  if(s.id==='cierre'){
    const score=totalScore();
    let em='🔴',semLabel='Ruta superficial',cls='ai-danger',msg='La propuesta de intervención no profundiza suficientemente en la inmunidad interna. Vuelve al diagnóstico y reformula los compromisos ocultos y la Gran Suposición.';
    if(score>=16){em='🟢';semLabel='Ruta integral';cls='ai-success';msg='¡Excelente trabajo! Tu propuesta de intervención tiene coherencia interna y externa. Documenta los supuestos y asegura que la estrategia crea experimentos seguros antes de ejecutar.';}
    else if(score>=11){em='🟡';semLabel='Ruta viable, pero frágil';cls='ai-warn';msg='Hay potencial pero quedan puntos ciegos. Revisa los criterios con puntaje bajo y verifica si la propuesta de intervención debilita realmente la Gran Suposición de los miembros de la comunidad.';}
    c.innerHTML=`<div class="card">
      <div class="trophy-block">
        <span class="trophy-em">${em}</span>
        <div class="trophy-title">${semLabel}</div>
        <div class="trophy-score">${score}<span style="font-size:20px;color:var(--g400)">/20</span></div>
        <div class="trophy-sub">${state.data.nombre_proyecto||'Tu proyecto'}</div>

      <div class="ai-bubble ${cls}" style="margin-top:12px">${msg}</div>
      <div id="cierre-fb"></div>
      <div class="divider"></div>
      <div class="btn-row" style="justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="goToStep(0)">← Revisar desde el inicio</button>
        <button class="btn btn-teal" onclick="callAI(buildPrompt(5),'cierre-fb',()=>{})">Análisis final IA ↗</button>
        <button class="btn btn-download" onclick="downloadReport()">Descargar reporte PDF ↓</button>
      </div>
    </div>`;
  }

  buildTabs();updateScorePill();
}

renderStep();
</script>
